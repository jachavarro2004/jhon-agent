# Jhon's release: on a tag vX.Y.Z (or vX.Y.Z-rc.N) of this repository,
# jachavarro2004/jhon-agent, build the tagged commit per arch on a native
# runner, sign each tarball and its SBOM with cosign keyless and publish one
# GitHub release. The source, the release workflow and the releases are one
# repository: no second checkout, no deploy key. The signer identity is this
# file at that tag:
#   https://github.com/jachavarro2004/jhon-agent/.github/workflows/release.yml@refs/tags/<tag>
# `jhon update` (engine/internal/update/verify.go, IdentityPattern) trusts
# exactly that, so renaming or moving this file breaks every update. Every
# job runs only in jachavarro2004/jhon-agent: a tag pushed to a fork or a
# private mirror of this repository never builds, signs or publishes.

name: release

on:
  push:
    tags:
      - "v*.*.*"

# Per job: the build job signs (id-token), only publish writes (contents).
permissions: {}

# One run per tag, never cancelled: a second push of the same tag waits
# instead of cutting a release in half (T11d).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # engine/internal/update/verify.go's Issuer and IdentityPattern, verbatim.
  SIGNER_ISSUER: https://token.actions.githubusercontent.com
  SIGNER_IDENTITY: ^https://github\.com/jachavarro2004/jhon-agent/\.github/workflows/release\.yml@refs/tags/v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-rc\.(0|[1-9]\d*))?$

jobs:
  tag:
    name: check the tag
    if: github.repository == 'jachavarro2004/jhon-agent'
    runs-on: ubuntu-24.04
    # Every job has a limit: GitHub's default is 6 hours of billed time (T11d, L62).
    timeout-minutes: 5
    permissions: {}
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-rc\.(0|[1-9][0-9]*))?$'; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rc.N (no leading zeros)"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          case "$TAG" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    name: build ${{ matrix.arch }}
    if: github.repository == 'jachavarro2004/jhon-agent'
    needs: tag
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native runners: pack runs the Go tests, so no cross-compile.
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # rc1 built in 14m24s (amd64) and 13m30s (arm64) when it built more than jhon.
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.tag.outputs.version }}
      OUT: ${{ github.workspace }}/dist-out
      # A static jhon: no glibc floor (WSL's Ubuntu 22.04, S3).
      CGO_ENABLED: "0"
    steps:
      - name: Check out ${{ github.ref_name }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Install Go (go.mod's go line)
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Build jhon and pack the release
        working-directory: src
        env:
          JHON_SOURCE: ${{ github.workspace }}/src
        run: |
          go build -trimpath -o build/jhon ./engine/cmd/jhon
          git status --porcelain
          build/jhon release pack --version "$VERSION" --out "$OUT"
          tarball="$OUT/jhon-$VERSION-linux-${{ matrix.arch }}.tar.gz"
          test -f "$tarball" && test -f "$tarball.sha256"
          (cd "$OUT" && sha256sum -c "$(basename "$tarball").sha256")
          # The binary in the tarball is static (no program interpreter).
          check=$(mktemp -d)
          tar -xzf "$tarball" -C "$check" build/jhon
          b="$check/build/jhon"
          if ! h=$(readelf -lW "$b" 2>&1) || ! grep -q 'Program Headers:' <<<"$h"; then
            echo "::error::readelf cannot read $b: $h"; exit 1
          fi
          if grep -q 'program interpreter' <<<"$h"; then
            echo "::error::$(basename "$b") in the tarball is dynamically linked"; exit 1
          fi

      - name: The same commit packs to the same bytes
        working-directory: src
        env:
          JHON_SOURCE: ${{ github.workspace }}/src
        # A second pack in a fresh staging dir must match the first byte for
        # byte (T52): -trimpath, -buildvcs=false, the commit's time as every
        # timestamp, a sorted tar owned by 0:0 with no PAX headers.
        run: tools/release/repro.sh build/jhon "$VERSION" "$OUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Sign and verify the tarball and its SBOM
        run: |
          # The SBOM (SPDX 2.3 JSON, written by pack: the binary's Go modules,
          # the Go standard library, the shell's non-dev npm packages) is
          # signed by the same identity as the tarball it describes (T52).
          for f in "$OUT/jhon-$VERSION-linux-${{ matrix.arch }}.tar.gz" "$OUT/jhon-$VERSION-linux-${{ matrix.arch }}.spdx.json"; do
            test -f "$f"
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
            cosign verify-blob --bundle "$f.sigstore.json" \
              --certificate-identity-regexp "$SIGNER_IDENTITY" \
              --certificate-oidc-issuer "$SIGNER_ISSUER" \
              "$f"
          done

      - name: Release notes from the CHANGELOG
        if: matrix.arch == 'amd64'
        run: |
          # The `## [X.Y.Z]` section (or `## X.Y.Z`), up to the next `## `.
          # POSIX awk only: Ubuntu's default is mawk.
          awk -v v="$VERSION" '
            /^## / { if (on) exit; h=$0; sub(/^## \[?/, "", h); sub(/\].*$/, "", h); sub(/ .*$/, "", h); on = (h == v); next }
            on { print }
          ' src/CHANGELOG.md > "$OUT/notes.md"
          if [ ! -s "$OUT/notes.md" ]; then
            echo "Jhon $VERSION." > "$OUT/notes.md"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}
          path: dist-out/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish ${{ github.ref_name }}
    if: github.repository == 'jachavarro2004/jhon-agent'
    needs: [tag, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-out
          merge-multiple: true

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.tag.outputs.version }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          cd dist-out
          assets=()
          for arch in amd64 arm64; do
            for ext in tar.gz tar.gz.sha256 tar.gz.sigstore.json spdx.json spdx.json.sigstore.json; do
              f="jhon-$VERSION-linux-$arch.$ext"
              test -f "$f" || { echo "::error::missing $f"; exit 1; }
              assets+=("$f")
            done
          done
          # An rc must be a pre-release: /releases/latest never offers one (S11).
          flags=()
          if [ "$PRERELEASE" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Jhon $VERSION" --notes-file notes.md "${flags[@]}"
