<title id="t">Jhon's agents and their launch context</title>
<desc id="d">The orchestrator holds the conversation and launches focused sub-agents: jhon-scout, jhon-builder, jhon-checker, and the Prism facets with a challenger and an arbiter. Each launch carries the brief and, when found, the decisions on record from Engram, a code map from CodeGraph, and for jhon-checker and the facets the tests to judge.</desc>
