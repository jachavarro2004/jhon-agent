<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">The guards around one tool call</title>
<desc id="d">Every tool call of every Jhon agent passes jhon hook pre-tool: inspect, safety, vcs, framework, secrets, scope and route guards in order. The first refusal answers; otherwise the first ask, which a grant or the project's mode may pass; otherwise the call is allowed and, with sandbox.mode on, a command runs in the OS sandbox.</desc>
