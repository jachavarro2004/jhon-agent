<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">LDD: a change from its first slice to delivery</title>
<desc id="d">A change is built in slices. Each slice gets a recorded failing run (RED), the code, a recorded passing run (GREEN), and a slice commit that route-guard checks is the tested tree. A light verify, or verify and the Prism facets on the verified route, comes before delivery, which jhon deliver check and route-guard gate.</desc>
