<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="t d">
<title id="t">Two runtimes over one engine</title>
<desc id="d">Claude Code (jhon start) and pi (jhon start pi with the jhon-shell package) both run the same jhon binary for their guards and records. The binary renders prose/ into each runtime from an installed release, and the dashboard reads only what the binary serves.</desc>
